name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm install instead of npm ci: the lockfile, generated on Windows,
      # only carries a full entry for the Windows lightningcss (Tailwind's
      # CSS engine) binary. npm install re-resolves the Linux optional
      # binary for this runner instead of erroring on the missing entry.
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
