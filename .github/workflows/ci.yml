name: CI

on:
  push:
    branches: [main, dev]
  # Runs on anything opened against main, whatever branch it comes from, so a
  # release candidate is checked once more before it lands.
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
